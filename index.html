<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tiny-VAC // CORE</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gasket: #3fa9dc;
            --gasket-deep: #1f6fa8;
            --gasket-pale: #e4f2fb;
            --gasket-ring: #bfe3f7;
            --body-white: #ffffff;
            --bg: #eef3f7;
            --panel: #ffffff;
            --panel-border: #dfe7ee;
            --ink: #17242f;
            --muted: #66768349;
            --muted-2: #647585;
            --signal-green: #17975e;
            --signal-green-bg: #e6f6ee;
            --signal-yellow: #b8720a;
            --signal-yellow-bg: #fdf1de;
            --signal-red: #d0332a;
            --signal-red-bg: #fdeceb;
            --offline-grey: #8b98a3;
            --offline-bg: #f0f3f5;
            --mono: 'IBM Plex Mono', monospace;
            --sans: 'Inter', sans-serif;
            --neon-blue: var(--gasket-deep);
            --neon-green: var(--signal-green);
            --neon-red: var(--signal-red);
        }

        * { box-sizing: border-box; }

        #boids-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: var(--bg);
        }

        body {
            font-family: var(--sans);
            background: transparent;
            color: var(--ink);
            margin: 0;
            padding: 20px 14px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a, button, select { font-family: inherit; }
        *:focus-visible { outline: 2px solid var(--gasket-deep); outline-offset: 2px; }

        .app-shell { width: 100%; max-width: 1100px; }

        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 4px 20px;
            flex-wrap: wrap; gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-icon {
            width: 46px; height: 46px; flex-shrink: 0;
            border-radius: 50%;
            background: var(--body-white);
            border: 3px solid var(--gasket);
            box-shadow: 0 0 0 4px var(--gasket-ring), 0 2px 8px rgba(31, 111, 168, 0.18);
            display: flex; align-items: center; justify-content: center;
        }
        .brand-icon svg { width: 20px; height: 20px; }
        h1 {
            font-family: var(--sans);
            color: var(--ink);
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            line-height: 1.3;
        }
        h1 span { color: var(--gasket-deep); font-weight: 600; }
        .brand-sub {
            font-family: var(--mono); font-size: 0.68rem; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--muted-2); margin-top: 2px;
        }
        .clock {
            font-family: var(--mono); font-size: 0.95rem; color: var(--gasket-deep);
            background: var(--panel); border: 1px solid var(--panel-border);
            padding: 9px 16px; border-radius: 999px; letter-spacing: 1.5px;
            box-shadow: 0 1px 3px rgba(23, 36, 47, 0.06);
        }

        .status-box {
            width: 100%;
            background: var(--panel);
            padding: 16px 18px;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            margin-bottom: 18px;
            box-shadow: 0 1px 3px rgba(23, 36, 47, 0.05);
        }
        .status-row {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            padding-bottom: 14px; margin-bottom: 14px;
            border-bottom: 1px solid var(--panel-border);
        }
        #connection-status {
            font-family: var(--mono); font-size: 0.78rem; letter-spacing: 1px; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }
        #connection-status::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 18%, transparent);
        }
        #subscription-status {
            color: var(--muted-2); font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.5px;
        }

        .summary-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .summary-chip {
            display: flex; flex-direction: column; gap: 3px;
            background: var(--bg);
            border: 1px solid var(--panel-border);
            padding: 10px 14px; border-radius: 12px;
        }
        .summary-chip .chip-top { display: flex; align-items: center; gap: 6px; }
        .summary-chip .dot { width: 8px; height: 8px; border-radius: 50%; }
        .summary-chip .chip-label { font-size: 0.68rem; letter-spacing: 0.5px; color: var(--muted-2); text-transform: uppercase; }
        .summary-chip span[id^="count-"] { font-family: var(--mono); font-weight: 700; font-size: 1.3rem; color: var(--ink); }
        .summary-chip.online .dot { background: var(--signal-green); }
        .summary-chip.warning .dot { background: var(--signal-yellow); }
        .summary-chip.offline .dot { background: var(--offline-grey); }
        .summary-chip.alarm .dot { background: var(--signal-red); }

        .dashboard {
            display: flex; flex-direction: column; gap: 18px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .dashboard { display: grid; grid-template-columns: 1fr 1fr; }
        }

        .alarms, .devices {
            background: var(--panel);
            padding: 18px;
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(23, 36, 47, 0.05);
            border-top: 3px solid var(--signal-red);
        }
        .devices { border-top-color: var(--gasket); }

        h2 {
            font-family: var(--sans);
            font-size: 0.82rem;
            font-weight: 700;
            margin: 0 0 14px;
            color: var(--ink);
            letter-spacing: 0.2px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .message-list, .device-list {
            list-style: none;
            padding: 0; margin: 0;
            width: 100%;
            max-height: 420px;
            overflow-y: auto;
        }
        .message-list:empty::after, .device-list:empty::after {
            content: 'No signal yet';
            display: block;
            font-family: var(--mono); font-size: 0.72rem; letter-spacing: 1px;
            color: #b7c1c9; text-align: center; padding: 30px 0;
        }

        .message-list li, .device-list li {
            background: var(--bg);
            padding: 12px 14px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 0.9rem;
            border: 1px solid var(--panel-border);
            transition: background 0.25s ease, border-color 0.25s ease;
        }
        .message-list li span:first-child, .device-list li span:first-child { font-family: var(--mono); font-size: 0.82rem; }

        .alert-item { background: var(--signal-red-bg); border-color: #f6c8c4; color: var(--signal-red); }
        .warning-item { background: var(--signal-yellow-bg); border-color: #f5dba8; color: var(--signal-yellow); }
        .device-online { background: var(--signal-green-bg); border-color: #bfe7d2; color: var(--signal-green); }
        .device-warning { background: var(--signal-yellow-bg); border-color: #f5dba8; color: var(--signal-yellow); }
        .device-offline { background: var(--offline-bg); border-color: var(--panel-border); opacity: 0.75; color: var(--offline-grey); }

        @keyframes pulse-blink {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.15); box-shadow: 0 0 0 3px rgba(63, 169, 220, 0.25); }
            100% { filter: brightness(1); }
        }
        .blink-active { animation: pulse-blink 0.4s ease-in-out; }

        .settings-icon {
            cursor: pointer; font-size: 1rem;
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.6);
            transition: background 0.2s ease, transform 0.2s ease;
            flex-shrink: 0;
        }
        .settings-icon:hover { background: var(--body-white); transform: rotate(35deg); }

        #settings-ui {
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 95%; max-width: 400px;
            background: var(--body-white);
            border: 1px solid var(--panel-border);
            padding: 0 22px 22px;
            z-index: 1000;
            display: none;
            border-radius: 20px;
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(23, 36, 47, 0.25);
        }
        .settings-header {
            margin: 0 -22px 18px; padding: 16px 22px;
            background: linear-gradient(135deg, var(--gasket), var(--gasket-deep));
            border-radius: 20px 20px 0 0;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0;
        }
        #settings-close {
            cursor: pointer; color: rgba(255,255,255,0.85);
            font-family: var(--mono); font-size: 0.8rem; letter-spacing: 1px;
            transition: color 0.2s ease;
        }
        #settings-close:hover { color: #fff; }

        #settings-ui h3 {
            text-align: left; font-family: var(--sans);
            color: #fff; letter-spacing: 0.2px; font-size: 1rem; font-weight: 700;
            margin: 0;
        }

        .battery-container { width: 90px; height: 10px; background: var(--bg); margin: 6px auto; border: 1px solid var(--panel-border); border-radius: 5px; overflow: hidden; }
        .battery-level { height: 100%; transition: width 0.3s; }
        #battery-level-text { font-family: var(--mono); font-size: 0.72rem; color: var(--muted-2); letter-spacing: 1px; }

        .pressure-label {
            background: #0d1b24;
            border-radius: 12px;
            padding: 18px;
            margin: 4px 0 14px;
            display: flex;
            justify-content: space-around;
            border: 1px solid #1c3542;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.35);
        }
        .pressure-label label { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: #6f96a8; }
        .set-pressure { font-family: var(--mono); color: var(--gasket); font-size: 2rem; text-shadow: 0 0 14px rgba(63, 169, 220, 0.55); }
        .real-pressure { font-family: var(--mono); color: #d8e6ec; font-size: 1.5rem; opacity: 0.85; }

        .gauge-block { margin-bottom: 18px; }
        .gauge-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .gauge-row .g-label { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; color: var(--muted-2); width: 34px; flex-shrink: 0; }
        .gauge-track { flex: 1; height: 7px; background: var(--bg); border-radius: 4px; border: 1px solid var(--panel-border); overflow: hidden; }
        .gauge-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.4s ease; }
        #gauge-set-fill { background: linear-gradient(90deg, var(--gasket-deep), var(--gasket)); }
        #gauge-real-fill { background: linear-gradient(90deg, #9aa7b0, #cbd4da); }

        .settings-button {
            font-family: var(--sans); padding: 13px;
            border: 1px solid var(--panel-border); cursor: pointer;
            width: 100%; border-radius: 12px; margin-bottom: 10px;
            font-weight: 700; letter-spacing: 0.2px; font-size: 0.9rem;
            transition: filter 0.2s ease, transform 0.1s ease;
        }
        .settings-button:active { transform: translateY(1px); }
        .settings-plus, .settings-minus {
            background: var(--bg); color: var(--ink); width: 48%; font-size: 1.4rem;
        }
        .settings-plus:hover, .settings-minus:hover { background: var(--gasket-pale); }
        .settings-save { background: linear-gradient(135deg, var(--gasket), var(--gasket-deep)); color: #fff; border: none; }
        .settings-save:hover { filter: brightness(1.06); }

        .setting-group { margin-bottom: 12px; }
        .setting-group label {
            display: block; font-family: var(--mono); font-size: 0.66rem;
            letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 6px; color: var(--muted-2);
        }
        .setting-group select {
            width: 100%; padding: 10px; background: var(--bg); color: var(--ink);
            border: 1px solid var(--panel-border); border-radius: 8px; font-size: 0.9rem;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c7d1d8; border-radius: 4px; }

        .foot {
            text-align: center; color: #9aa7b0; font-family: var(--mono);
            font-size: 0.65rem; letter-spacing: 1.5px; margin-top: 26px;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.08rem; }
            .clock { font-size: 0.8rem; padding: 7px 12px; }
        }
    </style>
</head>
<body>

    <canvas id="boids-canvas"></canvas>

    <div class="app-shell">
        <div class="topbar">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#1f6fa8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v6M12 21v-4M5 12H3M21 12h-2M7 7l1.5 1.5M17 7l-1.5 1.5M7 17l1.5-1.5M17 17l-1.5-1.5"/>
                        <circle cx="12" cy="12" r="3.4"/>
                    </svg>
                </div>
                <div>
                    <h1>Tiny-VAC <span>// Core</span></h1>
                    <div class="brand-sub">Device telemetry &amp; control</div>
                </div>
            </div>
            <div class="clock" id="live-clock">--:--:--</div>
        </div>

        <div class="status-box">
            <div class="status-row">
                <div id="connection-status">CONNECTING...</div>
                <div id="subscription-status">GROUPS: WAITING</div>
            </div>
            <div class="summary-strip" id="summary-strip">
                <div class="summary-chip online">
                    <div class="chip-top"><span class="dot"></span><span class="chip-label">Online</span></div>
                    <span id="count-online">0</span>
                </div>
                <div class="summary-chip warning">
                    <div class="chip-top"><span class="dot"></span><span class="chip-label">Warning</span></div>
                    <span id="count-warning">0</span>
                </div>
                <div class="summary-chip offline">
                    <div class="chip-top"><span class="dot"></span><span class="chip-label">Offline</span></div>
                    <span id="count-offline">0</span>
                </div>
                <div class="summary-chip alarm">
                    <div class="chip-top"><span class="dot"></span><span class="chip-label">Alarms logged</span></div>
                    <span id="count-alarm">0</span>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <div class="alarms">
                <h2>Alarms</h2>
                <ul class="message-list" id="messages"></ul>
            </div>

            <div class="devices">
                <h2>Devices</h2>
                <ul class="device-list" id="active-devices"></ul>
            </div>
        </div>

        <div class="foot">TINY-VAC CORE · MQTT TELEMETRY CONSOLE</div>
    </div>

    <div id="settings-ui">
        <div class="settings-header">
            <h3>Device settings</h3>
            <div id="settings-close">CLOSE ✕</div>
        </div>

        <div id="battery-indicator" style="text-align: center;">
            <div class="battery-container"><div class="battery-level" id="battery-level-display"></div></div>
            <div id="battery-level-text">0%</div>
        </div>

        <div class="pressure-label">
            <div style="text-align:center;"><label>SET</label><br><span class="set-pressure">N/A</span></div>
            <div style="text-align:center;"><label>REAL</label><br><span class="real-pressure">N/A</span></div>
        </div>

        <div class="gauge-block">
            <div class="gauge-row">
                <span class="g-label">SET</span>
                <div class="gauge-track"><div class="gauge-fill" id="gauge-set-fill"></div></div>
            </div>
            <div class="gauge-row">
                <span class="g-label">REAL</span>
                <div class="gauge-track"><div class="gauge-fill" id="gauge-real-fill"></div></div>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <button class="settings-button settings-minus">−</button>
            <button class="settings-button settings-plus">+</button>
        </div>

        <div class="setting-group">
            <label>Leak Alarm</label>
            <select id="leak-alarm"><option value="15">15s</option><option value="30">30s</option><option value="60">1m</option><option value="120">2m</option><option value="OFF">OFF</option></select>
        </div>
        <div class="setting-group">
            <label>Canister Full</label>
            <select id="canister-full"><option value="+20">+20</option><option value="+40">+40</option><option value="+80">+80</option><option value="A">A</option><option value="OFF">OFF</option></select>
        </div>
        <div class="setting-group">
            <label>Blockage</label>
            <select id="blockage"><option value="15">15s</option><option value="30">30s</option><option value="60">1m</option><option value="120">2m</option><option value="OFF">OFF</option></select>
        </div>
        <div class="setting-group">
            <label>Sound Alarm</label>
            <select id="sound-alarm"><option value="ON">ON</option><option value="OFF">OFF</option></select>
        </div>
        <div class="setting-group">
            <label>Battery Alarm</label>
            <select id="battery-alarm"><option value="ON">ON</option><option value="OFF">OFF</option></select>
        </div>

        <button class="settings-button settings-start">START</button>
        <button class="settings-button settings-save">SAVE</button>
    </div>

    <script>
        const canvas = document.getElementById('boids-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        const numDots = 26;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Dot {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.r = 1 + Math.random() * 1.6;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(63, 169, 220, 0.14)';
                ctx.fill();
            }
        }
        for (let i = 0; i < numDots; i++) dots.push(new Dot());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let d of dots) { d.update(); d.draw(); }
            requestAnimationFrame(animate);
        }
        animate();

        let client;
        let deviceHeartbeats = {};
        let currentDevice = "";

        function getUrlParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const username = getUrlParam("username");
        const password = getUrlParam("password");
        const topics = getUrlParam("topics") ? getUrlParam("topics").split(",") : [];
        const brokerUrl = "wss://tinyvacmqtt188.cloud.shiftr.io";

        const tgUser = getUrlParam("tgUser");
        const tgName = getUrlParam("tgName");

        if (!tgUser || !tgName) {
            document.body.innerHTML = `
                <div style="text-align: center; margin-top: 20vh; font-family: var(--sans);">
                    <h2 style="color: var(--signal-red);">Access Denied</h2>
                    <p>Please use the Telegram bot to get your dashboard link.</p>
                </div>`;
            throw new Error("Missing Telegram User ID - stopping execution.");
        }

        function connectMQTT() {
            client = mqtt.connect(brokerUrl, { username, password });
            client.on("connect", function () {
                $("#connection-status").text("CONNECTED").css("color", "var(--neon-green)");
                client.subscribe('vacAlarms');
                if (topics.length > 0) {
                    topics.forEach(topic => client.subscribe(topic));
                    $("#subscription-status").text("GROUPS: " + topics.join(", ")).css("color", "var(--neon-blue)");
                }
            });
            client.on("message", function (topic, message) {
                handleMessage(topic, message.toString());
            });
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
        }

        function handleMessage(topic, message) {
            try {
                const parsed = JSON.parse(message);
                const deviceName = parsed.deviceName || "Unknown";
                const batteryLevel = parsed.batteryLevel ?? "N/A";
                const status = parsed.status || "Unknown";
                const type = parsed.type || "info";
                const msgContent = parsed.message || "No message";
                const timestamp = getCurrentTime();
                
                if (!deviceHeartbeats[deviceName]) { deviceHeartbeats[deviceName] = {}; }
                deviceHeartbeats[deviceName].lastSeen = Date.now();
                deviceHeartbeats[deviceName].batteryLevel = batteryLevel;
                deviceHeartbeats[deviceName].status = status;
                deviceHeartbeats[deviceName].setPressure = parsed.setPressure;
                deviceHeartbeats[deviceName].realPressure = parsed.realPressure;
                deviceHeartbeats[deviceName].therapyEnabled = parsed.therapyEnabled;
                deviceHeartbeats[deviceName].deviceTopic = parsed.topic;
                deviceHeartbeats[deviceName].alarmSettings = parsed.alarmSettings;

                updateUI(deviceName, parsed);

                if (batteryLevel !== "N/A" && status !== "Unknown") {
                    let deviceText = `${deviceName} ${batteryLevel}% | Status: ${status}`;
                    let icon = `<span class="settings-icon" onclick="openSettings('${deviceName}')">⚙️</span>`;
                    let deviceElement = $(`#${deviceName}`);
                    let newClass = (status === "Alarm" || status === "Warning") ? "device-warning" : "device-online";

                    if (deviceElement.length) {
                        deviceElement.removeClass("device-offline device-online device-warning").addClass(newClass).html(`<span>${deviceText}</span> ${icon}`);
                    } else {
                        $("#active-devices").append(`<li id="${deviceName}" class="${newClass}"><span>${deviceText}</span> ${icon}</li>`);
                        deviceElement = $(`#${deviceName}`);
                    }
                    
                    deviceElement.addClass("blink-active");
                    setTimeout(() => deviceElement.removeClass("blink-active"), 400);
                }

                if (type === "Alarm" || type === "Warning") {
                    let alertClass = type === "Alarm" ? "alert-item" : "warning-item";
                    $("#messages").prepend(`
                        <li class="${alertClass}">
                            <span><b>${deviceName}:</b> ${msgContent}</span>
                            <span style="font-size: 10px; opacity: 0.6;">${timestamp}</span>
                        </li>`);
                }
            } catch (e) { console.error("JSON Error", e); }
        }

        function updateUI(deviceName, data) {
            if (currentDevice === deviceName) {
                if (data.realPressure !== undefined) { $(".real-pressure").text(data.realPressure); }
                if (data.therapyEnabled !== undefined) {
                    $(".settings-start").text(data.therapyEnabled === 1 ? "STOP" : "START").css("background", data.therapyEnabled === 1 ? "var(--neon-red)" : "green");
                }
                if (data.batteryLevel !== undefined) { updateBatteryDisplay(data.batteryLevel); }
            }
        }

        function updateBatteryDisplay(level) {
            const color = level <= 20 ? "var(--neon-red)" : (level <= 50 ? "#ff0" : "var(--neon-green)");
            $("#battery-level-display").css({"background": color, "width": level + "%"});
            $("#battery-level-text").text(level + "%");
        }

        function openSettings(deviceName) {
            currentDevice = deviceName;
            const info = deviceHeartbeats[deviceName];
            $("#settings-ui").fadeIn(200);
            if (info) {
                $(".set-pressure").text(info.setPressure ?? "N/A");
                $(".real-pressure").text((info.realPressure ?? "N/A"));
                $(".settings-start").text(info.therapyEnabled === 1 ? "STOP" : "START").css("background", info.therapyEnabled === 1 ? "var(--neon-red)" : "green");
                updateBatteryDisplay(info.batteryLevel !== "N/A" ? info.batteryLevel : 0);
                if (info.alarmSettings) {
                    $("#leak-alarm").prop('selectedIndex', parseInt(info.alarmSettings[0]));
                    $("#canister-full").prop('selectedIndex', parseInt(info.alarmSettings[1]));
                    $("#blockage").prop('selectedIndex', parseInt(info.alarmSettings[2]));
                    $("#sound-alarm").prop('selectedIndex', parseInt(info.alarmSettings[3]));
                    $("#battery-alarm").prop('selectedIndex', parseInt(info.alarmSettings[4]));
                }
            }
        }

        $("#settings-close").click(() => $("#settings-ui").fadeOut(200));

        $(".settings-plus").click(() => {
            let val = parseInt($(".set-pressure").text()) || 0;
            if (val < 300) $(".set-pressure").text(val + 10);
        });

        $(".settings-minus").click(() => {
            let val = parseInt($(".set-pressure").text()) || 0;
            if (val > 10) $(".set-pressure").text(val - 10);
        });

        $(".settings-start").click(() => {
            const info = deviceHeartbeats[currentDevice];
            if (info) {
                const newState = info.therapyEnabled === 1 ? 0 : 1;
                const payload = JSON.stringify({
                    deviceName: currentDevice, command: "updateSettings", therapyEnabled: newState,
                    setPressure: parseInt($(".set-pressure").text()),
                    leakAlarm: $("#leak-alarm").val(), canisterFull: $("#canister-full").val(), blockage: $("#blockage").val(),
                    soundAlarm: $("#sound-alarm").val(), batteryAlarm: $("#battery-alarm").val(),
                    tgUser: tgUser, tgName: tgName 
                });
                client.publish(`${info.deviceTopic}/${currentDevice}/settings`, payload);
                info.therapyEnabled = newState;
                updateUI(currentDevice, {therapyEnabled: newState});
            }
        });

        $(".settings-save").click(() => {
            const info = deviceHeartbeats[currentDevice];
            if (info) {
                const alarmStr = [$("#leak-alarm").prop('selectedIndex'), $("#canister-full").prop('selectedIndex'), $("#blockage").prop('selectedIndex'), $("#sound-alarm").prop('selectedIndex'), $("#battery-alarm").prop('selectedIndex')].join("");
                const payload = JSON.stringify({
                    deviceName: currentDevice, command: "updateSettings",
                    setPressure: parseInt($(".set-pressure").text()), therapyEnabled: info.therapyEnabled, alarmSettings: alarmStr,
                    tgUser: tgUser, tgName: tgName 
                });
                client.publish(`${info.deviceTopic}/${currentDevice}/settings`, payload);
                $("#settings-ui").fadeOut(200);
            }
        });

        setInterval(() => {
            const now = Date.now();
            for (let d in deviceHeartbeats) {
                if (now - deviceHeartbeats[d].lastSeen >= 20000) {
                    $(`#${d}`).removeClass("device-online device-warning").addClass("device-offline").text(`${d} - Offline`);
                }
            }
        }, 5000);

        connectMQTT();
    </script>

    <script>
        function tickClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }
        tickClock();
        setInterval(tickClock, 1000);

        function refreshSummary() {
            const items = document.querySelectorAll('#active-devices li');
            let online = 0, warning = 0, offline = 0;
            items.forEach(li => {
                if (li.classList.contains('device-online')) online++;
                else if (li.classList.contains('device-warning')) warning++;
                else if (li.classList.contains('device-offline')) offline++;
            });
            document.getElementById('count-online').textContent = online;
            document.getElementById('count-warning').textContent = warning;
            document.getElementById('count-offline').textContent = offline;
            document.getElementById('count-alarm').textContent = document.querySelectorAll('#messages .alert-item').length;
        }
        const devicesEl = document.getElementById('active-devices');
        const messagesEl = document.getElementById('messages');
        new MutationObserver(refreshSummary).observe(devicesEl, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
        new MutationObserver(refreshSummary).observe(messagesEl, { childList: true });
        refreshSummary();

        const maxScale = 300;
        function refreshGauges() {
            const setVal = parseInt(document.querySelector('.set-pressure').textContent) || 0;
            const realVal = parseInt(document.querySelector('.real-pressure').textContent) || 0;
            document.getElementById('gauge-set-fill').style.width = Math.min(100, (setVal / maxScale) * 100) + '%';
            document.getElementById('gauge-real-fill').style.width = Math.min(100, (realVal / maxScale) * 100) + '%';
        }
        const setEl = document.querySelector('.set-pressure');
        const realEl = document.querySelector('.real-pressure');
        new MutationObserver(refreshGauges).observe(setEl, { childList: true, characterData: true, subtree: true });
        new MutationObserver(refreshGauges).observe(realEl, { childList: true, characterData: true, subtree: true });
        refreshGauges();
    </script>
</body>
</html>
